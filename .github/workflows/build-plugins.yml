name: Build plugins

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem build/dist/plugins/*.dll | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii build/dist/plugins/SHA256SUMS.txt
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stackwell-plugins-windows-x64
          path: build/dist/plugins/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" build/dist/plugins/*.dll build/dist/plugins/SHA256SUMS.txt --repo "${{ github.repository }}" --generate-notes

      - name: Publish latest binaries for the plugin catalog
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view latest --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --repo "${{ github.repository }}" --title "Latest Windows x64 plugins" --notes "Automatically built from the main branch. For stable releases, use a versioned release." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not create latest plugin release." }
          }
          gh release upload latest build/dist/plugins/*.dll build/dist/plugins/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload plugin binaries." }
